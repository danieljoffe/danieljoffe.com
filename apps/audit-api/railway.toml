[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/audit-api/Dockerfile"

[deploy]
startCommand = "uv run --package audit-api uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
