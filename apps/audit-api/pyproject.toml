[project]
name = "audit-api"
version = "0.1.0"
description = "Audit scan API — runs Lighthouse + axe scans, grades results, serves reports"
authors = [{ name = "Daniel Joffe" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic-settings>=2.7",
  "pyjwt>=2.10",
  # Must match the Playwright base image tag in apps/audit-api/Dockerfile —
  # browser binaries ship at version-specific paths in the base image.
  "playwright==1.58.0",
  "supabase>=2.9",
  "sentry-sdk[fastapi]>=2.19",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.11",
  "mypy>=1.15",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "I", "N", "W", "UP",
  "B", "S", "SIM", "RUF", "T20",
  "PTH",    # flake8-use-pathlib — Path over os.path
  "ASYNC",  # async anti-patterns (blocking calls in coroutines)
]
ignore = [
  "B008",   # Depends() in FastAPI arg defaults is idiomatic
  "S105",   # false positives on non-secret pattern constants
  "S106",   # false positives on non-secret pattern constants
]

[tool.ruff.lint.per-file-ignores]
# ASYNC109: test helpers use a `timeout` arg as a polling deadline,
#   not a single-await timeout — `asyncio.timeout` would change semantics.
"tests/**/*.py" = ["S101", "S108", "ASYNC109"]
"scripts/**/*.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --no-cov-on-fail"
