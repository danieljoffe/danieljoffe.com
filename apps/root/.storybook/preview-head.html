<style>
  :root {
    --font-heading: 'Fraunces', 'Fraunces Fallback', Georgia, 'Times New Roman',
      serif;
    --font-body: 'Space Grotesk', 'Space Grotesk Fallback', system-ui,
      -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'IBM Plex Mono Fallback', Consolas, Monaco,
      monospace;

    /* Color System - Light Mode (Default) */
    --background: #fdfbf7;
    --background-alt: #f5f3ee;
    --background-elevated: #ffffff;
    --foreground: #1a1a1a;
    --foreground-muted: #6b6b6b;
    --foreground-subtle: #9a9a9a;

    --accent: #6b5b95;
    --accent-hover: #574a7a;
    --accent-active: #453b62;
    --accent-muted: #eeeaf4;
    --accent-foreground: #fdfbf7;

    --border: #e5e2da;
    --border-strong: #d0ccc2;

    --success: #2d6a4f;
    --success-muted: #e8f5ee;
    --success-foreground: #fdfbf7;

    --warning: #8b7425;
    --warning-muted: #f5f0e0;
    --warning-foreground: #fdfbf7;

    --error: #b54332;
    --error-muted: #fceeed;
    --error-foreground: #fdfbf7;

    --info: #2b6b8a;
    --info-muted: #e8f2f7;
    --info-foreground: #fdfbf7;

    --card: #ffffff;
    --card-foreground: #1a1a1a;

    --input: #ffffff;
    --input-border: #d0ccc2;

    --ring: #6b5b95;

    /* Typography Tokens */
    --font-size-base: 1.0625rem;
    --font-size-h1: clamp(2rem, 3vw + 1rem, 2.75rem);
    --font-size-h2: 1.75rem;
    --font-size-h3: 1.375rem;
    --font-size-h4: 1.125rem;
    --font-size-h5: 0.875rem;
    --font-size-h6: 0.875rem;
    --font-size-code: 0.9375rem;

    --line-height-base: 1.6;
    --line-height-h1: 1.2;
    --line-height-h2: 1.25;
    --line-height-h3: 1.3;
    --line-height-h4: 1.4;
    --line-height-h5: 1.5;
    --line-height-h6: 1.5;
    --line-height-code: 1.5;

    --letter-spacing-h1: -0.02em;
    --letter-spacing-h2: -0.01em;

    --font-weight-normal: 300;
    --font-weight-medium: 500;
    --font-weight-semibold: 600;

    /* Spacing for Typography */
    --h1-margin-top: 0;
    --h1-margin-bottom: 1.5rem;
    --h2-margin-top: 3rem;
    --h2-margin-bottom: 1rem;
    --h3-margin-top: 2.5rem;
    --h3-margin-bottom: 0.75rem;
    --h4-margin-top: 2rem;
    --h4-margin-bottom: 0.5rem;
    --h5-margin-top: 1.5rem;
    --h5-margin-bottom: 0.5rem;
    --h6-margin-top: 1.5rem;
    --h6-margin-bottom: 0.5rem;

    /* Radius */
    --radius: 0.25rem;
  }

  * {
    box-sizing: border-box;
  }

  html {
    font-family: var(--font-body);
    background-color: var(--background);
    color: var(--foreground);
    font-size: 16px;
  }

  body {
    background-color: var(--background);
    color: var(--foreground);
    font-family: var(--font-body);
    font-size: var(--font-size-base);
    line-height: var(--line-height-base);
    font-weight: var(--font-weight-normal);
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: var(--font-heading);
    color: inherit;
    text-wrap: balance;
    margin: 0;
  }


  h1 {
    font-size: var(--font-size-h1);
    line-height: var(--line-height-h1);
    letter-spacing: var(--letter-spacing-h1);
    font-weight: var(--font-weight-semibold);
    margin-top: var(--h1-margin-top);
    margin-bottom: var(--h1-margin-bottom);
    font-variation-settings: 'opsz' 144, 'WONK' 1;
  }

  h2 {
    font-size: var(--font-size-h2);
    line-height: var(--line-height-h2);
    letter-spacing: var(--letter-spacing-h2);
    font-weight: var(--font-weight-semibold);
    margin-top: var(--h2-margin-top);
    margin-bottom: var(--h2-margin-bottom);
    font-variation-settings: 'opsz' 72, 'WONK' 1;
  }

  h3 {
    font-size: var(--font-size-h3);
    line-height: var(--line-height-h3);
    font-weight: var(--font-weight-semibold);
    margin-top: var(--h3-margin-top);
    margin-bottom: var(--h3-margin-bottom);
    font-variation-settings: 'opsz' 36, 'WONK' 0;
  }

  h4 {
    font-size: var(--font-size-h4);
    line-height: var(--line-height-h4);
    font-weight: var(--font-weight-semibold);
    margin-top: var(--h4-margin-top);
    margin-bottom: var(--h4-margin-bottom);
    font-variation-settings: 'opsz' 24, 'WONK' 0;
  }

  h5 {
    font-size: var(--font-size-h5);
    line-height: var(--line-height-h5);
    font-weight: var(--font-weight-medium);
    margin-top: var(--h5-margin-top);
    margin-bottom: var(--h5-margin-bottom);
    font-variation-settings: 'opsz' 12, 'WONK' 0;
  }

  h6 {
    font-size: var(--font-size-h6);
    line-height: var(--line-height-h6);
    font-weight: var(--font-weight-medium);
    margin-top: var(--h6-margin-top);
    margin-bottom: var(--h6-margin-bottom);
    font-variation-settings: 'opsz' 12, 'WONK' 0;
  }

  ul,
  ol {
    list-style: none;
  }

  :is(h1, h2, h3, h4, h5, h6):first-child {
    margin-top: 0;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border-width: 0;
  }

  .sr-only:focus,
  .focus\\:not-sr-only:focus {
    position: static;
    width: auto;
    height: auto;
    padding: 0;
    margin: 0;
    overflow: visible;
    clip: auto;
    white-space: normal;
  }

  #storybook-root {
    height: 100% !important;
    width: 100% !important;
    flex: 1 !important;
    margin: 0 !important;
    padding: 0 !important;
  }
</style>
