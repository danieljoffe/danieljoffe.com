<!doctype html>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
  rel="stylesheet"
/>

<!--
  Sync Tailwind's .dark class with the addon-themes toolbar toggle.
  The withThemeByClassName decorator handles story pages, but during
  initial load something clears the class before the decorator's
  useEffect fires. A MutationObserver guards the initial state, and
  a channel listener keeps MDX docs pages (where decorators don't
  run) in sync with the toolbar.
-->
<script>
  (function () {
    var DARK = 'dark';
    var html = document.documentElement;
    var currentTheme = DARK;

    function apply() {
      html.classList.toggle(DARK, currentTheme === DARK);
    }

    // Set initial dark class (matches preview.ts defaultTheme: 'dark')
    apply();

    // Guard the INITIAL paint only: if something clears the class before the
    // decorator's useEffect fires, re-assert it. This runs for a short window
    // then disconnects (below) so it never fights *runtime* theme changes made
    // by the components under test — e.g. the ThemeProvider / ThemeToggle demos
    // toggle the `dark` class themselves and must stay visible.
    var observer = new MutationObserver(function () {
      if (currentTheme === DARK && !html.classList.contains(DARK)) {
        observer.disconnect();
        apply();
        observer.observe(html, {
          attributes: true,
          attributeFilter: ['class'],
        });
      }
    });
    observer.observe(html, { attributes: true, attributeFilter: ['class'] });

    // The guard is only needed during initial load. After that the decorator
    // and the toolbar listener own the class, so stop observing — otherwise
    // runtime theme changes from components get reverted.
    setTimeout(function () {
      observer.disconnect();
    }, 1000);

    // Poll for the Storybook channel (it's created after this script) to keep
    // MDX docs pages (where decorators don't run) in sync with the toolbar.
    var timer = setInterval(function () {
      var ch = window.__STORYBOOK_ADDONS_CHANNEL__;
      if (!ch) return;
      clearInterval(timer);

      ch.on('globalsUpdated', function (args) {
        var theme = args && args.globals && args.globals.theme;
        if (theme) {
          currentTheme = theme;
          apply();
        }
      });
    }, 50);
  })();
</script>

<style>
  /* Let the docs wrapper background respond to the theme toggle */
  .docs-story,
  .sbdocs-wrapper,
  .sbdocs.sbdocs-content,
  #storybook-docs {
    background: var(--color-surface) !important;
    padding: 1rem !important;
  }

  /* Theme-aware text colors for autodocs pages */
  #storybook-docs h1,
  #storybook-docs h2,
  #storybook-docs h3,
  #storybook-docs h4,
  #storybook-docs h5,
  #storybook-docs h6 {
    color: var(--color-text-primary) !important;
  }

  #storybook-docs p,
  #storybook-docs li,
  #storybook-docs label {
    color: var(--color-text-primary) !important;
  }

  #storybook-docs a {
    color: var(--color-text-brand) !important;
  }

  #storybook-docs hr {
    border-color: var(--color-border) !important;
  }

  /* Inline code only — leave <pre> code blocks to the dark docs theme's
     syntax highlighter so its light tokens keep their own dark backdrop. */
  #storybook-docs :not(pre) > code {
    background: var(--color-surface-secondary) !important;
  }

  #storybook-docs pre {
    border: 1px solid var(--color-border) !important;
  }
</style>
