<!doctype html>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Space+Grotesk:wght@300..700&display=swap"
  rel="stylesheet"
/>

<!--
  Sync Tailwind's .dark class with the addon-themes toolbar toggle.
  The withThemeByClassName decorator handles story pages, but during
  initial load something clears the class before the decorator's
  useEffect fires. A MutationObserver guards the initial state, and
  a channel listener keeps MDX docs pages (where decorators don't
  run) in sync with the toolbar.
-->
<script>
  (function () {
    var DARK = 'dark';
    var html = document.documentElement;
    var currentTheme = DARK;

    function apply() {
      html.classList.toggle(DARK, currentTheme === DARK);
    }

    // Set initial dark class (matches preview.ts defaultTheme: 'dark')
    apply();

    // Guard against anything that clears the class during init.
    // Once the channel listener is active, the observer only acts
    // as a safety net — both the decorator and the listener set
    // the same value so there is no conflict.
    var observer = new MutationObserver(function () {
      if (currentTheme === DARK && !html.classList.contains(DARK)) {
        observer.disconnect();
        apply();
        observer.observe(html, {
          attributes: true,
          attributeFilter: ['class'],
        });
      }
    });
    observer.observe(html, { attributes: true, attributeFilter: ['class'] });

    // Poll for the Storybook channel (it's created after this script).
    var timer = setInterval(function () {
      var ch = window.__STORYBOOK_ADDONS_CHANNEL__;
      if (!ch) return;
      clearInterval(timer);

      ch.on('globalsUpdated', function (args) {
        var theme = args && args.globals && args.globals.theme;
        if (theme) {
          currentTheme = theme;
          apply();
        }
      });
    }, 50);
  })();
</script>

<style>
  .sb-main-fullscreen.sb-show-main {
    height: 100vh;
  }

  body #storybook-root,
  body #storybook-docs {
    color: var(--foreground);
  }

  #storybook-docs > div {
    padding: 0;
    margin: 0;
  }

  #storybook-root,
  #storybook-docs > div {
    height: 100%;
    background-color: transparent;
  }

  #storybook-root h1,
  #storybook-docs .sbdocs-title {
    color: var(--foreground);
  }

  #storybook-docs .sbdocs-preview {
    background-color: var(--background-elevated);
    /* border-color: var(--background-elevated); */
  }
  #storybook-docs [role="toolbar"],
  #storybook-docs table thead > tr > *,
  #storybook-docs table tbody > tr > *  {
    background-color: var(--background-elevated);
    color: var(--foreground);
  }

  #storybook-root,
  #storybook-docs {
    padding: 2rem;
    max-width: 860px;
    margin: 0 auto;
  }
</style>
