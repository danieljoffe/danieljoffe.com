name: CI Pipeline
description: Setup workspace and run CI checks (lint, typecheck, test, build, e2e)

inputs:
  run-e2e:
    description: Whether to run e2e tests
    default: 'true'
  base-branch:
    description: Base branch for nx affected comparison (defaults to main)
    default: 'main'
  github-token:
    description: GitHub token for Lighthouse CI status checks
    default: ''
  chromatic-project-token:
    description: Chromatic project token for visual regression testing
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: yarn

    - name: Install dependencies
      shell: bash
      run: yarn install --frozen-lockfile

    - uses: nrwl/nx-set-shas@v5
      with:
        main-branch-name: ${{ inputs.base-branch }}

    - name: Run affected tasks
      shell: bash
      run: yarn nx affected -t lint test build typecheck build-storybook --nxBail
      env:
        NX_NO_CLOUD: 'true'

    - name: Install Playwright
      if: ${{ inputs.run-e2e == 'true' }}
      shell: bash
      run: yarn playwright install --with-deps chromium

    - name: Run e2e tests
      if: ${{ inputs.run-e2e == 'true' }}
      shell: bash
      run: yarn nx affected -t e2e --nxBail
      env:
        NX_NO_CLOUD: 'true'

    - name: Run Chromatic visual tests
      if: ${{ inputs.chromatic-project-token != '' }}
      shell: bash
      run: yarn chromatic:ui --exit-zero-on-changes --exit-once-sent
      env:
        CHROMATIC_PROJECT_TOKEN: ${{ inputs.chromatic-project-token }}

    - name: Build app for Lighthouse CI
      if: ${{ inputs.run-e2e == 'true' }}
      shell: bash
      run: yarn nx build root
      env:
        NX_NO_CLOUD: 'true'

    - name: Run Lighthouse CI
      if: ${{ inputs.run-e2e == 'true' }}
      shell: bash
      run: yarn test:lighthouse
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ inputs.github-token }}
