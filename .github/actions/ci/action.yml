name: CI Pipeline
description: Setup workspace and run CI checks (lint, typecheck, test, build, e2e)

inputs:
  run-e2e:
    description: Whether to run e2e tests
    default: 'true'
  base-branch:
    description: Base branch for nx affected comparison (defaults to main)
    default: 'main'
  github-token:
    description: GitHub token for Lighthouse CI status checks
    default: ''
  chromatic-project-token:
    description: Chromatic project token for visual regression testing
    default: ''
  nx-cloud-token:
    description: Nx Cloud access token for remote caching
    default: ''
  nx-cloud-id:
    description: Nx Cloud workspace ID
    default: ''

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5

    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Cache Nx
      uses: actions/cache@v5
      with:
        path: .nx/cache
        key: ${{ runner.os }}-nx-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-nx-${{ hashFiles('**/pnpm-lock.yaml') }}-
          ${{ runner.os }}-nx-

    - uses: nrwl/nx-set-shas@v5
      with:
        main-branch-name: ${{ inputs.base-branch }}

    - name: Run affected tasks
      shell: bash
      run: pnpm nx affected -t lint test build typecheck build-storybook --nxBail --exclude=job-api
      env:
        NX_CLOUD_ACCESS_TOKEN: ${{ inputs.nx-cloud-token }}
        NX_CLOUD_ID: ${{ inputs.nx-cloud-id }}

    - name: Get Playwright version
      if: ${{ inputs.run-e2e == 'true' }}
      id: playwright-version
      shell: bash
      run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      if: ${{ inputs.run-e2e == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright
      if: ${{ inputs.run-e2e == 'true' }}
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: Run e2e tests
      if: ${{ inputs.run-e2e == 'true' }}
      shell: bash
      run: pnpm nx affected -t e2e --nxBail
      env:
        NX_CLOUD_ACCESS_TOKEN: ${{ inputs.nx-cloud-token }}
        NX_CLOUD_ID: ${{ inputs.nx-cloud-id }}

    - name: Run Chromatic visual tests
      if: ${{ inputs.chromatic-project-token != '' }}
      shell: bash
      run: pnpm chromatic:ui --exit-zero-on-changes --exit-once-sent
      env:
        CHROMATIC_PROJECT_TOKEN: ${{ inputs.chromatic-project-token }}

    - name: Build app for Lighthouse CI
      if: ${{ inputs.run-e2e == 'true' }}
      shell: bash
      run: pnpm nx build root
      env:
        NX_CLOUD_ACCESS_TOKEN: ${{ inputs.nx-cloud-token }}
        NX_CLOUD_ID: ${{ inputs.nx-cloud-id }}

    - name: Run Lighthouse CI
      if: ${{ inputs.run-e2e == 'true' }}
      shell: bash
      run: pnpm test:lighthouse
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ inputs.github-token }}
