name: Deploy Storybook to Vercel
description: Build Storybook and deploy static output to Vercel

inputs:
  vercel-token:
    description: Vercel authentication token
    required: true
  vercel-org-id:
    description: Vercel organization ID
    required: true
  vercel-project-id:
    description: Vercel project ID for Storybook
    required: true
  production:
    description: Whether this is a production deployment
    default: 'false'
  vercel-version:
    description: Vercel CLI version to install
    default: '50.15.1'

outputs:
  url:
    description: Deployed URL
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5

    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build Storybook
      shell: bash
      run: pnpm nx build-storybook @danieljoffe.com/shared-ui

    - name: Install Vercel CLI
      shell: bash
      run: npm i -g vercel@${{ inputs.vercel-version }}

    - name: Prepare Vercel prebuilt output
      shell: bash
      working-directory: libs/shared/ui
      run: |
        ENV_FLAG=""
        if [ "${{ inputs.production }}" = "true" ]; then
          ENV_FLAG="--environment=production"
        fi
        vercel pull --yes $ENV_FLAG --token=${{ inputs.vercel-token }}
        mkdir -p .vercel/output/static
        cp -r storybook-static/* .vercel/output/static/
        echo '{"version":3}' > .vercel/output/config.json
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}

    - name: Deploy
      id: deploy
      shell: bash
      working-directory: libs/shared/ui
      run: |
        PROD_FLAG=""
        if [ "${{ inputs.production }}" = "true" ]; then
          PROD_FLAG="--prod"
        fi
        url=$(vercel deploy --prebuilt $PROD_FLAG --token=${{ inputs.vercel-token }})
        echo "url=$url" >> "$GITHUB_OUTPUT"
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
