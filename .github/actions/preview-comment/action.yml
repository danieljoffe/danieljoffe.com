name: Post Preview Comment
description: Create or update a PR comment with a preview deployment URL

inputs:
  label:
    description: Label for the preview (e.g. "Preview" or "Storybook preview")
    required: true
  url:
    description: Deployed preview URL
    required: true
  marker:
    description: Unique HTML comment marker to identify and update existing comments
    required: true
  github-token:
    description: GitHub token for API access
    required: true

runs:
  using: composite
  steps:
    - name: Comment preview URL
      uses: actions/github-script@v8
      env:
        PREVIEW_LABEL: ${{ inputs.label }}
        PREVIEW_URL: ${{ inputs.url }}
        COMMENT_MARKER: ${{ inputs.marker }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = process.env.COMMENT_MARKER;
          const body = `${marker}\n**${process.env.PREVIEW_LABEL}:** ${process.env.PREVIEW_URL}\n\n_Updated: ${new Date().toISOString()}_`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
