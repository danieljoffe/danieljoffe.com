name: Vercel Deploy
description: Build and deploy to Vercel

inputs:
  vercel-token:
    description: Vercel authentication token
    required: true
  vercel-org-id:
    description: Vercel organization ID
    required: true
  vercel-project-id:
    description: Vercel project ID
    required: true
  production:
    description: Whether this is a production deployment
    default: 'false'
  vercel-version:
    description: Vercel CLI version to install
    default: '50.15.1'

outputs:
  url:
    description: Deployed URL
    value: ${{ steps.deploy.outputs.url }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5

    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install Vercel CLI
      shell: bash
      run: npm i -g vercel@${{ inputs.vercel-version }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Pull Vercel Config
      shell: bash
      run: vercel pull --yes ${{ inputs.production == 'true' && '--environment=production' || '' }} --token=${{ inputs.vercel-token }}
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}

    - name: Build
      shell: bash
      run: vercel build ${{ inputs.production == 'true' && '--prod' || '' }} --token=${{ inputs.vercel-token }}
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}

    - name: Deploy
      id: deploy
      shell: bash
      run: |
        set +e
        out=$(vercel deploy --prebuilt ${{ inputs.production == 'true' && '--prod' || '' }} --token=${{ inputs.vercel-token }} 2>&1)
        status=$?
        set -e
        echo "$out"
        if [ "$status" -ne 0 ]; then
          # A preview deploy that hits Vercel's free-tier daily cap must not block
          # the PR — the code already passed full CI. Production deploys stay strict,
          # and any other deploy error still fails.
          if [ "${{ inputs.production }}" != "true" ] && printf '%s' "$out" | grep -qiE 'api-deployments-free-per-day|Resource is limited'; then
            echo "::warning::Vercel free-tier daily deployment limit reached — preview deploy skipped (non-blocking)."
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"
        fi
        url=$(printf '%s' "$out" | grep -Eo 'https://[^[:space:]]+' | tail -n1)
        echo "url=$url" >> "$GITHUB_OUTPUT"
      env:
        VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
        VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
