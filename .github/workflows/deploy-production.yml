# .github/workflows/deploy-production.yml
name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nx-base: ${{ steps.shas.outputs.base }}
      nx-head: ${{ steps.shas.outputs.head }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          filter: tree:0
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v5
        id: shas
        with:
          main-branch-name: main

  fast:
    name: CI Fast
    needs: preflight
    uses: ./.github/workflows/ci-fast.yml
    with:
      nx-base: ${{ needs.preflight.outputs.nx-base }}
      nx-head: ${{ needs.preflight.outputs.nx-head }}
    secrets: inherit

  full:
    name: CI Full
    needs: [preflight, fast]
    uses: ./.github/workflows/ci-full.yml
    with:
      nx-base: ${{ needs.preflight.outputs.nx-base }}
      nx-head: ${{ needs.preflight.outputs.nx-head }}
    secrets: inherit

  deploy:
    name: Production Deploy
    needs: [fast, full]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: ./.github/actions/vercel-deploy
        id: deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          production: 'true'

      - name: Summary
        run: echo "### Production deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy failed
        if: failure()
        run: echo "### Production deploy failed — [view logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"

  deploy-storybook:
    name: Storybook Production Deploy
    needs: [fast, full]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: ./.github/actions/vercel-deploy-storybook
        id: deploy-storybook
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_STORYBOOK_PROJECT_ID }}
          production: 'true'

      - name: Summary
        run: echo "### Storybook deployed to ${{ steps.deploy-storybook.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy failed
        if: failure()
        run: echo "### Storybook deploy failed — [view logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
