name: CI Fast

on:
  workflow_call:
    inputs:
      nx-base:
        description: NX_BASE SHA for affected detection
        type: string
        required: true
      nx-head:
        description: NX_HEAD SHA for affected detection
        type: string
        required: true
    secrets:
      NX_CLOUD_ACCESS_TOKEN:
        required: false
      NX_CLOUD_ID:
        required: false

env:
  # Nx Cloud org is disabled until the May 1 credit reset; skip the cloud handshake entirely.
  NX_NO_CLOUD: 'true'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Lint, typecheck, test, build affected
        run: pnpm nx affected -t lint typecheck test build --exclude=wyrdfold-api,audit-api --nxBail
        env:
          NX_BASE: ${{ inputs.nx-base }}
          NX_HEAD: ${{ inputs.nx-head }}
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          NX_CLOUD_ID: ${{ secrets.NX_CLOUD_ID }}

      - name: Dead code check (Knip)
        run: pnpm knip
