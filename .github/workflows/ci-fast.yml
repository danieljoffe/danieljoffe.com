name: CI Fast

on:
  workflow_call:
    inputs:
      nx-base:
        description: NX_BASE SHA for affected detection
        type: string
        required: true
      nx-head:
        description: NX_HEAD SHA for affected detection
        type: string
        required: true

env:
  # @nx/s3-cache plugin → Cloudflare R2 (see nx.json `s3` block).
  NX_KEY: ${{ secrets.NX_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Lint, typecheck, test, build affected
        run: pnpm nx affected -t lint typecheck test build --nxBail
        env:
          NX_BASE: ${{ inputs.nx-base }}
          NX_HEAD: ${{ inputs.nx-head }}

      - name: Dead code check (Knip)
        run: pnpm knip
