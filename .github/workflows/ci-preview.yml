name: CI + Preview Deploy

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check source branch
        if: github.head_ref != 'develop' && github.head_ref != 'changeset-release/main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "PRs to main must come from develop or the changesets release branch, not '${HEAD_REF}'"
          exit 1
      - name: Source branch OK
        if: github.head_ref == 'develop' || github.head_ref == 'changeset-release/main'
        run: echo "PR source branch OK ('${{ github.head_ref }}')"

  # Full CI already ran on merge to develop; Vercel build validates compilation.
  preview:
    name: Vercel Preview
    needs: check-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/vercel-deploy
        id: deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      - uses: ./.github/actions/preview-comment
        with:
          label: Preview deployed
          url: ${{ steps.deploy.outputs.url }}
          marker: '<!-- vercel-preview-url -->'
          github-token: ${{ github.token }}

  storybook-preview:
    name: Storybook Preview
    needs: check-source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/vercel-deploy-storybook
        id: deploy-storybook
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_STORYBOOK_PROJECT_ID }}

      - uses: ./.github/actions/preview-comment
        with:
          label: Storybook preview
          url: ${{ steps.deploy-storybook.outputs.url }}
          marker: '<!-- storybook-preview-url -->'
          github-token: ${{ github.token }}
