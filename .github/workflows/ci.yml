name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches-ignore:
      - main # PRs to main are handled by ci-preview.yml
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Regenerate VR baselines, commit to branch, and upload as artifact'
        type: boolean
        default: false
      snapshot-branch:
        description: 'Branch to update snapshots on (defaults to the branch selected above)'
        type: string
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v5
      - name: Check for docs-only changes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path')
          else
            # Push to develop — always run CI
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DOCS_ONLY=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md) ;;
              .claude/*) ;;
              .mcp.json) ;;
              .vscode/*) ;;
              .github/ISSUE_TEMPLATE/*|.github/prompts/*|.github/skills/*|.github/agents/*|.github/workflows/*) ;;
              .husky/*) ;;
              .prettierrc|.nvmrc|.sentryclirc|.editorconfig|.nxignore|LICENSE) ;;
              *) DOCS_ONLY=false; break ;;
            esac
          done <<< "$CHANGED"

          echo "docs-only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

  ci:
    needs: changes
    if: ${{ needs.changes.outputs.docs-only != 'true' && !inputs.update-snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: ./.github/actions/ci
        with:
          run-e2e: ${{ github.event_name != 'push' }}
          base-branch: ${{ github.base_ref || 'main' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          chromatic-project-token: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  ci-status:
    if: always()
    needs: [changes, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CI succeeded or was skipped
        run: |
          if [ "${{ needs.ci.result }}" = "failure" ] || [ "${{ needs.ci.result }}" = "cancelled" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed or was skipped (docs-only change)"

  update-snapshots:
    if: ${{ inputs.update-snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
          ref: ${{ inputs.snapshot-branch || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/ci
        with:
          run-e2e: 'false'

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Build app for snapshot generation
        run: yarn nx build root

      - name: Regenerate VR snapshots
        working-directory: apps/root-e2e
        run: npx playwright test src/visual-regression.spec.ts --update-snapshots --project=chromium

      - name: Upload VR baselines
        uses: actions/upload-artifact@v6
        with:
          name: vr-baselines
          path: apps/root-e2e/src/visual-regression.spec.ts-snapshots/
          if-no-files-found: error

      - name: Commit and push updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/root-e2e/src/visual-regression.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "chore(e2e): update visual regression snapshots from CI"
            echo "Pushing to $(git branch --show-current)..."
            git push
            echo "Push complete"
          fi
