name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches-ignore:
      - main # PRs to main are handled by ci-preview.yml
    # ready_for_review re-triggers CI when a draft is marked ready, so the
    # draft-gated jobs (fast) run before merge.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Regenerate VR baselines, commit to branch, and upload as artifact'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      e2e-changed: ${{ steps.classify.outputs.e2e-changed }}
      lighthouse-changed: ${{ steps.classify.outputs.lighthouse-changed }}
      storybook-changed: ${{ steps.classify.outputs.storybook-changed }}
      nx-base: ${{ steps.shas.outputs.base }}
      nx-head: ${{ steps.shas.outputs.head }}
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@v5
        id: shas
        with:
          main-branch-name: ${{ github.base_ref || 'main' }}

      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # gh pr view --json files truncates at 100 files; use the paginated REST endpoint instead.
            CHANGED=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          else
            # Classify on the actual pushed range. The nx-set-shas base tracks the
            # last *successful workflow* and can skip over commits (e.g. `[skip ci]`
            # baseline updates), which once let a shared-ui change miss the
            # storybook flag. before..sha is exactly what this push introduced.
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify -q "$BEFORE^{commit}" >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            else
              CHANGED=$(git diff --name-only "${{ steps.shas.outputs.base }}" "${{ steps.shas.outputs.head }}")
            fi
          fi

          DOCS_ONLY=true
          E2E=false
          LH=false
          SB=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md) ;;
              .claude/*) ;;
              .mcp.json) ;;
              .vscode/*) ;;
              .github/ISSUE_TEMPLATE/*|.github/workflows/*) ;;
              .husky/*) ;;
              .prettierrc|.nvmrc|.sentryclirc|.editorconfig|.nxignore|LICENSE|renovate.json|opencode.json) ;;
              .size-limit.json|knip.ts) ;;
              *) DOCS_ONLY=false ;;
            esac
            case "$file" in
              apps/root/*|apps/root-e2e/*|libs/*) E2E=true ;;
            esac
            case "$file" in
              apps/root/*|libs/shared/*) LH=true ;;
            esac
            case "$file" in
              libs/shared/ui/*|apps/root/.storybook/*|*.stories.ts|*.stories.tsx|*.stories.mdx|*.stories.js|*.stories.jsx) SB=true ;;
            esac
          done <<< "$CHANGED"

          echo "docs-only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "e2e-changed=$E2E" >> "$GITHUB_OUTPUT"
          echo "lighthouse-changed=$LH" >> "$GITHUB_OUTPUT"
          echo "storybook-changed=$SB" >> "$GITHUB_OUTPUT"
          echo "Flags: docs-only=$DOCS_ONLY e2e=$E2E lighthouse=$LH storybook=$SB"

  fast:
    needs: preflight
    if: ${{ needs.preflight.outputs.docs-only != 'true' && !inputs.update-snapshots && github.event.pull_request.draft != true }}
    uses: ./.github/workflows/ci-fast.yml
    with:
      nx-base: ${{ needs.preflight.outputs.nx-base }}
      nx-head: ${{ needs.preflight.outputs.nx-head }}
    secrets: inherit

  full:
    needs: [preflight, fast]
    if: ${{ needs.preflight.outputs.docs-only != 'true' && !inputs.update-snapshots && github.event_name == 'push' }}
    uses: ./.github/workflows/ci-full.yml
    with:
      nx-base: ${{ needs.preflight.outputs.nx-base }}
      nx-head: ${{ needs.preflight.outputs.nx-head }}
      e2e-changed: ${{ needs.preflight.outputs.e2e-changed }}
      lighthouse-changed: ${{ needs.preflight.outputs.lighthouse-changed }}
      storybook-changed: ${{ needs.preflight.outputs.storybook-changed }}
    secrets: inherit

  ci-status:
    if: always()
    needs: [preflight, fast, full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CI gate
        run: |
          echo "preflight: ${{ needs.preflight.result }}"
          echo "fast: ${{ needs.fast.result }}"
          echo "full: ${{ needs.full.result }}"

          # fast is required when it runs (non-docs PRs and pushes)
          if [ "${{ needs.fast.result }}" = "failure" ] || [ "${{ needs.fast.result }}" = "cancelled" ]; then
            echo "CI fast failed"
            exit 1
          fi

          # full is required on push to develop
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ needs.full.result }}" = "failure" ] || [ "${{ needs.full.result }}" = "cancelled" ]; then
              echo "CI full failed"
              exit 1
            fi
          fi

          echo "CI passed or was skipped (docs-only change)"

  update-snapshots:
    if: ${{ inputs.update-snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup-workspace

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build app for snapshot generation
        run: pnpm nx build root
        env:
          NX_KEY: ${{ secrets.NX_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Regenerate VR snapshots
        working-directory: apps/root-e2e
        run: pnpm exec playwright test src/visual-regression.spec.ts --update-snapshots --project=chromium

      - name: Upload VR baselines
        uses: actions/upload-artifact@v6
        with:
          name: vr-baselines
          path: apps/root-e2e/src/visual-regression.spec.ts-snapshots/
          if-no-files-found: error

      - name: Commit and push updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/root-e2e/src/visual-regression.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "chore(e2e): update visual regression snapshots from CI"
            echo "Pushing to $(git branch --show-current)..."
            git push
            echo "Push complete"
          fi
