name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches-ignore:
      - main # PRs to main are handled by ci-preview.yml
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Regenerate VR baselines and upload as artifact'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  ci:
    if: ${{ !inputs.update-snapshots }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: ./.github/actions/ci
        with:
          run-e2e: ${{ github.event_name != 'push' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          chromatic-project-token: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  update-snapshots:
    if: ${{ inputs.update-snapshots }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: ./.github/actions/ci
        with:
          run-e2e: 'false'

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Build app for snapshot generation
        run: yarn nx build root

      - name: Regenerate VR snapshots
        working-directory: apps/root-e2e
        run: npx playwright test src/visual-regression.spec.ts --update-snapshots --project=chromium

      - name: Upload VR baselines
        uses: actions/upload-artifact@v6
        with:
          name: vr-baselines
          path: apps/root-e2e/src/visual-regression.spec.ts-snapshots/
          if-no-files-found: error
