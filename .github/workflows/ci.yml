name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Regenerate VR baselines and upload as artifact'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - run: yarn playwright install --with-deps
      - uses: nrwl/nx-set-shas@v4

      - name: Run affected tasks
        run: yarn nx affected -t lint test build typecheck

      - name: Run e2e tests
        if: ${{ !inputs.update-snapshots }}
        run: yarn nx e2e root-e2e

      - name: Build app for snapshot generation
        if: ${{ inputs.update-snapshots }}
        run: yarn nx build root

      - name: Regenerate VR snapshots
        if: ${{ inputs.update-snapshots }}
        working-directory: apps/root-e2e
        run: npx playwright test src/visual-regression.spec.ts --update-snapshots

      - name: Upload VR baselines
        if: ${{ inputs.update-snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: vr-baselines
          path: apps/root-e2e/src/visual-regression.spec.ts-snapshots/
          if-no-files-found: error
