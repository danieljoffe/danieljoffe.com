name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches-ignore:
      - main # PRs to main are handled by ci-preview.yml
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Regenerate VR baselines, commit to branch, and upload as artifact'
        type: boolean
        default: false
      snapshot-branch:
        description: 'Branch to update snapshots on (defaults to the branch selected above)'
        type: string
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}
      nx-base: ${{ steps.shas.outputs.base }}
      nx-head: ${{ steps.shas.outputs.head }}
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Check for docs-only changes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path')
          else
            # Push to develop — always run CI
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DOCS_ONLY=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md) ;;
              .claude/*) ;;
              .mcp.json) ;;
              .vscode/*) ;;
              .github/ISSUE_TEMPLATE/*|.github/workflows/*) ;;
              .husky/*) ;;
              .prettierrc|.nvmrc|.sentryclirc|.editorconfig|.nxignore|LICENSE|renovate.json|opencode.json) ;;
              .size-limit.json|knip.ts) ;;
              *) DOCS_ONLY=false; break ;;
            esac
          done <<< "$CHANGED"

          echo "docs-only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

      - uses: nrwl/nx-set-shas@v5
        id: shas
        if: steps.check.outputs.docs-only != 'true'
        with:
          main-branch-name: ${{ github.base_ref || 'main' }}

  fast:
    needs: preflight
    if: ${{ needs.preflight.outputs.docs-only != 'true' && !inputs.update-snapshots }}
    uses: ./.github/workflows/ci-fast.yml
    with:
      nx-base: ${{ needs.preflight.outputs.nx-base }}
      nx-head: ${{ needs.preflight.outputs.nx-head }}
    secrets: inherit

  full:
    needs: [preflight, fast]
    if: ${{ needs.preflight.outputs.docs-only != 'true' && !inputs.update-snapshots && github.event_name == 'push' }}
    uses: ./.github/workflows/ci-full.yml
    with:
      nx-base: ${{ needs.preflight.outputs.nx-base }}
      nx-head: ${{ needs.preflight.outputs.nx-head }}
    secrets: inherit

  ci-python:
    needs: preflight
    if: ${{ needs.preflight.outputs.docs-only != 'true' && !inputs.update-snapshots && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run Python tasks
        run: yarn nx run-many -t lint test mypy --nxBail -p job-api

  ci-status:
    if: always()
    needs: [preflight, fast, full, ci-python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CI gate
        run: |
          echo "preflight: ${{ needs.preflight.result }}"
          echo "fast: ${{ needs.fast.result }}"
          echo "full: ${{ needs.full.result }}"
          echo "ci-python: ${{ needs.ci-python.result }}"

          # fast is required when it runs (non-docs PRs and pushes)
          if [ "${{ needs.fast.result }}" = "failure" ] || [ "${{ needs.fast.result }}" = "cancelled" ]; then
            echo "CI fast failed"
            exit 1
          fi

          if [ "${{ needs.ci-python.result }}" = "failure" ] || [ "${{ needs.ci-python.result }}" = "cancelled" ]; then
            echo "CI Python failed"
            exit 1
          fi

          # full is required on push to develop
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ needs.full.result }}" = "failure" ] || [ "${{ needs.full.result }}" = "cancelled" ]; then
              echo "CI full failed"
              exit 1
            fi
          fi

          echo "CI passed or was skipped (docs-only change)"

  update-snapshots:
    if: ${{ inputs.update-snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
          ref: ${{ inputs.snapshot-branch || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup-workspace

      - uses: nrwl/nx-set-shas@v5
        id: shas
        with:
          main-branch-name: develop

      - name: Run affected tasks
        run: pnpm nx affected -t lint test build typecheck build-storybook --nxBail
        env:
          NX_BASE: ${{ steps.shas.outputs.base }}
          NX_HEAD: ${{ steps.shas.outputs.head }}
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          NX_CLOUD_ID: ${{ secrets.NX_CLOUD_ID }}

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build app for snapshot generation
        run: pnpm nx build root
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          NX_CLOUD_ID: ${{ secrets.NX_CLOUD_ID }}

      - name: Regenerate VR snapshots
        working-directory: apps/root-e2e
        run: pnpm exec playwright test src/visual-regression.spec.ts --update-snapshots --project=chromium

      - name: Upload VR baselines
        uses: actions/upload-artifact@v6
        with:
          name: vr-baselines
          path: apps/root-e2e/src/visual-regression.spec.ts-snapshots/
          if-no-files-found: error

      - name: Commit and push updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/root-e2e/src/visual-regression.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "chore(e2e): update visual regression snapshots from CI"
            echo "Pushing to $(git branch --show-current)..."
            git push
            echo "Push complete"
          fi
