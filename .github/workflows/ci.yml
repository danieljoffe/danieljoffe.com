name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches-ignore:
      - main # PRs to main are handled by ci-preview.yml
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Regenerate VR baselines, commit to branch, and upload as artifact'
        type: boolean
        default: false
      snapshot-branch:
        description: 'Branch to update snapshots on (defaults to the branch selected above)'
        type: string
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  ci:
    if: ${{ !inputs.update-snapshots }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: ./.github/actions/ci
        with:
          run-e2e: ${{ github.event_name != 'push' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          chromatic-project-token: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

  update-snapshots:
    if: ${{ inputs.update-snapshots }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0
          ref: ${{ inputs.snapshot-branch || github.ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/ci
        with:
          run-e2e: 'false'

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Build app for snapshot generation
        run: yarn nx build root

      - name: Regenerate VR snapshots
        working-directory: apps/root-e2e
        run: npx playwright test src/visual-regression.spec.ts --update-snapshots --project=chromium

      - name: Upload VR baselines
        uses: actions/upload-artifact@v6
        with:
          name: vr-baselines
          path: apps/root-e2e/src/visual-regression.spec.ts-snapshots/
          if-no-files-found: error

      - name: Commit and push updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/root-e2e/src/visual-regression.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "chore(e2e): update visual regression snapshots from CI"
            echo "Pushing to $(git branch --show-current)..."
            git push
            echo "Push complete"
          fi
