# .github/workflows/enforce-develop.yml
name: Enforce PR Source Branch

on:
  pull_request:
    branches: [main]

jobs:
  check-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        if: github.head_ref != 'develop'
        run: |
          echo "❌ PRs to main must come from develop, not '${{ github.head_ref }}'"
          exit 1
      - name: Source branch OK
        if: github.head_ref == 'develop'
        run: echo "✅ PR is from develop"
