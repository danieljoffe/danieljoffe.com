name: Update Visual Baselines

# Regenerates the shared-ui visual-regression baselines on Linux (the only
# platform whose screenshots are committed) and pushes them to the branch it is
# dispatched on. Run this when stories change the way components look, then the
# visual job in CI compares against the committed references.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_KEY: ${{ secrets.NX_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.PAT_TOKEN }}

      - uses: ./.github/actions/setup-workspace

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers (Chromium)
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      # Tolerate a non-zero exit: on first generation toMatchScreenshot reports
      # "reference created" as a failure, but the PNGs are written to disk and
      # that is all we need to commit.
      - name: Regenerate visual baselines
        continue-on-error: true
        env:
          VITEST_VISUAL: 'true'
        run: pnpm nx run @danieljoffe/shared-ui:test-storybook --skip-nx-cache -- --project=visual --update

      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'libs/shared/ui/**/__screenshots__/**/*-linux.png'
          if git diff --staged --quiet; then
            echo "No baseline changes."
          else
            git commit -m "chore(visual): update shared-ui visual baselines from CI [skip ci]"
            git push
          fi
